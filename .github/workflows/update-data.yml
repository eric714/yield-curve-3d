name: Update data

# Treasury posts the day's yield curve in the late afternoon, New York time.
# This runs after that on weekdays, and can also be started by hand from the
# Actions tab.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No pip install: the builder uses only the Python standard library.
      - name: Fetch new data and rebuild the surface
        run: python3 pipeline/build_data.py

      - name: Commit, but only if something actually changed
        run: |
          git config user.name  "yield-curve-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data docs/preview.png
          if git diff --staged --quiet; then
            echo "No new data today. Nothing to commit."
          else
            git commit -m "Data through $(python3 -c "import json;print(json.load(open('docs/data/manifest.json'))['lastDate'])")"
            git push
          fi
